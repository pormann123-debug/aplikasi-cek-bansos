<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Bansos & KIP</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen p-4 flex justify-center items-center">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-6">
        <h1 class="text-2xl font-bold text-center text-blue-600 mb-6">Cek KIP & Bantuan Sosial</h1>

        <!-- Opsi 1: Scan KTP -->
        <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-2">Opsi 1: Scan Foto KTP</label>
            <input type="file" id="inputGambar" accept="image/*" 
                   class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            <p id="statusScan" class="text-xs text-blue-500 mt-2 hidden">Memproses gambar OCR... mohon tunggu.</p>
        </div>

        <div class="flex items-center my-4">
            <div class="flex-grow border-t border-gray-300"></div>
            <span class="px-3 text-gray-400 text-sm">ATAU</span>
            <div class="flex-grow border-t border-gray-300"></div>
        </div>

        <!-- Opsi 2: Input Manual -->
        <div class="mb-6">
            <label class="block text-sm font-medium text-gray-700 mb-2">Opsi 2: Masukkan 16 Digit NIK</label>
            <div class="flex gap-2">
                <input type="text" id="inputNik" maxlength="16" placeholder="Contoh: 1234567890123456" 
                       class="w-full border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="btnCek" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Cek</button>
            </div>
        </div>

        <!-- Area Hasil -->
        <div id="hasilCard" class="hidden bg-blue-50 border border-blue-200 rounded-lg p-4">
            <h2 class="text-lg font-semibold border-b border-blue-200 pb-2 mb-2">Hasil Pencarian</h2>
            <p class="text-sm text-gray-600">Nama: <span id="outNama" class="font-bold text-gray-900"></span></p>
            <p class="text-sm text-gray-600 mt-1">NIK: <span id="outNik" class="font-bold text-gray-900"></span></p>
            <p class="text-sm text-gray-600 mt-1">Status KIP: <span id="outKip" class="font-bold text-blue-600"></span></p>
            <p class="text-sm text-gray-600 mt-1">Bantuan Lain: <span id="outBansos" class="font-bold text-green-600"></span></p>
        </div>
        
        <!-- Pesan Error -->
        <div id="pesanError" class="hidden mt-4 p-3 bg-red-100 text-red-700 rounded-md text-sm text-center"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
